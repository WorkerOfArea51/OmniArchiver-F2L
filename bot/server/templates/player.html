<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - OmniArchiver F2L</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: #fff;
        }
        .brand span { color: var(--primary); }
        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }
        .media-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .media-title {
            font-size: 1.2rem;
            font-weight: 600;
            word-break: break-all;
        }
        .meta-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.825rem;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #1f2937; color: var(--text-main); border: 1px solid #374151; }
        .btn-secondary:hover { background-color: #374151; }
        .copy-toast {
            position: fixed;
            bottom: 2rem;
            background: #10b981;
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .copy-toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">? OmniArchiver <span>F2L</span></div>
        </header>

        <div class="player-wrapper">
            <video id="player" playsinline controls preload="metadata">
                <source src="{{ stream_url }}" type="{{ mime_type }}">
                Your browser does not support HTML5 video streaming.
            </video>
        </div>

        <div class="media-card">
            <h1 class="media-title">{{ file_name }}</h1>
            <div class="meta-badges">
                <span class="badge">?? {{ file_size }}</span>
                <span class="badge">??? {{ mime_type }}</span>
                <span class="badge">? Multi-Client Stream</span>
            </div>

            <div class="actions">
                <a href="{{ download_url }}" class="btn btn-primary" download>?? Download File</a>
                <button class="btn btn-secondary" onclick="copyToClipboard('{{ stream_url }}')">?? Copy Stream URL</button>
            </div>
        </div>
    </div>

    <div id="toast" class="copy-toast">Copied stream URL to clipboard!</div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Plyr('#player', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                seekTime: 10,
                keyboard: { focused: true, global: true }
            });
        });

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            });
        }
    </script>
</body>
</html>
