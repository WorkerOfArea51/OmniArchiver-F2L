<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Media Not Found</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #111827;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #1f2937;
            max-width: 450px;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; color: #ef4444; }
        p { color: #9ca3af; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            background: #6366f1;
            color: #fff;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>{{ message if message else 'The requested media could not be found or has been deleted.' }}</p>
        <a href="/">Return Home</a>
    </div>
</body>
</html>
